name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build Binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: "LaTeX-Translator-Windows.exe"
            build_cmd: python -m PyInstaller --onefile --windowed --clean --name "LaTeX-Translator-Windows" latex_to_text.py
            dist_path: "dist/LaTeX-Translator-Windows.exe"
          - os: ubuntu-latest
            artifact_name: "LaTeX-Translator-Linux"
            build_cmd: |
              sudo apt-get update && sudo apt-get install -y python3-tk
              python3 -m PyInstaller --onefile --windowed --clean --name "LaTeX-Translator-Linux" latex_to_text.py
            dist_path: "dist/LaTeX-Translator-Linux"
          - os: macos-latest
            artifact_name: "LaTeX-Translator-macOS"
            build_cmd: python3 -m PyInstaller --onefile --windowed --clean --name "LaTeX-Translator-macOS" latex_to_text.py
            dist_path: "dist/LaTeX-Translator-macOS"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build executable
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_path }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
